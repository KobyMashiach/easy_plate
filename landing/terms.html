  "intro": "تحكم شروط الخدمة هذه (\"الشروط\") استخدامك لتطبيق EasyPlate والخدمات المرتبطة به (\"EasyPlate\"، \"الخدمة\")، التي يشغّلها فريق EasyPlate (\"نحن\"). بإنشاء حساب أو استخدام الخدمة فإنك توافق على هذه الشروط وعلى سياسة الخصوصية الخاصة بنا. إذا لم توافق، فلا تستخدم الخدمة.",

  function linkify(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/support@aieasyplate\.app/g, '<a href="mailto:support@aieasyplate.app">support@aieasyplate.app</a>');
  }
  function render(lang) {
    const d = DOCS[lang], m = META[lang];
    document.documentElement.lang = lang; document.documentElement.dir = m.dir;
    document.title = d.title + ' — EasyPlate';
    document.getElementById('title').textContent = d.title;
    document.getElementById('updated').textContent = d.updated;
    document.getElementById('intro').textContent = d.intro;
    document.getElementById('tocTitle').textContent = d.toc;
    document.getElementById('navHome').textContent = m.home;
    document.getElementById('navOther').textContent = m[OTHER_KEY];
    document.getElementById('footOther').textContent = m[OTHER_KEY];
    document.getElementById('copyright').textContent = m.copyright;
    const q = '?lang=' + lang;
    for (const id of ['homeLink', 'navHome']) document.getElementById(id).href = 'index.html' + q;
    for (const id of ['navOther', 'footOther']) document.getElementById(id).href = 'privacy.html' + q;
    const toc = document.getElementById('toc'), secs = document.getElementById('sections');
    toc.innerHTML = ''; secs.innerHTML = '';
    d.sections.forEach((s, i) => {
      const id = 's' + (i + 1);
      const li = document.createElement('li'); li.innerHTML = `<a href="#${id}">${s.h.replace(/</g, '&lt;')}</a>`; toc.appendChild(li);
      const sec = document.createElement('section'); sec.id = id;
      sec.innerHTML = `<h2>${s.h.replace(/</g, '&lt;')}</h2>` + s.p.map(p => {
        const m2 = p.match(/^([^.]{2,60}\.)\s/);  // lead-in like "Account details." in bold
        return m2 && m2[1].split(' ').length <= 5 ? `<p><b>${linkify(m2[1])}</b> ${linkify(p.slice(m2[0].length))}</p>` : `<p>${linkify(p)}</p>`;
      }).join('');
      secs.appendChild(sec);
    });
    const sel = document.getElementById('langSel');
    sel.innerHTML = Object.keys(META).map(k => `<option value="${k}" ${k === lang ? 'selected' : ''}>${META[k].name}</option>`).join('');
    observe();
  }
  function observe() {
    if (!('IntersectionObserver' in window)) return;
    const links = [...document.querySelectorAll('#toc a')];
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id)); } }), { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('section').forEach(s => io.observe(s));
  }
  document.getElementById('langSel').addEventListener('change', e => {
    const l = e.target.value; try { localStorage.setItem('ep-lang', l); } catch (_) {}
    history.replaceState(null, '', '?lang=' + l); render(l);
  });
  render(pickLang());
  </script>
</body>
</html>
