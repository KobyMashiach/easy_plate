<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>EasyPlate Admin</title>
  <meta name="theme-color" content="#0c0a1f" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <noscript>EasyPlate Admin needs JavaScript.</noscript>

  <!-- Until Firebase has said who is here: a blank splash, so a refresh
       while signed in never flashes the sign-in card. -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-stage">
      <div class="splash-halo"></div>
      <div class="splash-tile"><img src="/icon-192.png" alt="" width="112" height="112" /></div>
    </div>
    <div class="splash-title">Easy Plate</div>
    <div class="splash-dots"><i></i><i></i><i></i></div>
  </div>

  <!-- Sign-in gate: shown once Firebase says nobody is signed in. -->
  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <img src="/icon-192.png" alt="" width="64" height="64" class="gate-logo" />
      <h1 data-i18n="gate.title">EasyPlate Admin</h1>
      <p data-i18n="gate.intro" class="muted"></p>
      <button id="gateSignIn" class="btn primary wide" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6C12.3 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.7-4.2-13.6-10l-7.8 6C6.5 42.6 14.6 48 24 48z"/></svg>
        <span data-i18n="gate.google"></span>
      </button>
      <p id="gateError" class="error" hidden></p>
      <div class="gate-lang">
        <label for="gateLang" data-i18n="lang"></label>
        <select id="gateLang" class="select"></select>
      </div>
    </div>
  </div>

  <!-- The console -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/dashboard"><img src="/icon-64.png" alt="" width="28" height="28" /><span>EasyPlate <b>Admin</b></span></a>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <select id="langSel" class="select" aria-label="Language"></select>
        <div class="me" id="me"></div>
        <button id="signOut" class="btn ghost small" type="button" data-i18n="signOut"></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="navToggle" class="btn ghost icon" type="button" aria-label="Menu">☰</button>
        <h1 id="pageTitle"></h1>
        <div id="pageActions" class="page-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modals"></div>
  <div id="toasts" class="toasts"></div>

  <script type="module" src="/admin/js/app.js"></script>
</body>
</html>
