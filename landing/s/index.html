<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open in EasyPlate</title>
  <meta name="description" content="Someone shared a recipe, book or meal plan with you on EasyPlate. Open it in the app." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c0a1f" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Heebo:wght@400;600;800&family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0c0a1f; --panel: rgba(255,255,255,.05); --line: rgba(255,255,255,.1); --fg: #f3eeff; --muted: rgba(243,238,255,.62); --brand: #8c6bff; --brand2: #ff7ac3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.6 "Plus Jakarta Sans", Heebo, "Noto Sans Arabic", system-ui, sans-serif; padding: 24px 16px; }
    html[dir="rtl"] body { font-family: Heebo, "Noto Sans Arabic", "Plus Jakarta Sans", system-ui, sans-serif; }
    html[lang="ar"] body { font-family: "Noto Sans Arabic", Heebo, system-ui, sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(600px 400px at 50% -10%, rgba(140,107,255,.35), transparent 70%), radial-gradient(500px 300px at 90% 100%, rgba(255,122,195,.18), transparent 70%); }
    .card { width: min(100%, 440px); background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 28px 24px; text-align: center; backdrop-filter: blur(12px); }
    .logo { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px; display: block; }
    h1 { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
    p { margin: 0 0 18px; color: var(--muted); }
    .code { direction: ltr; font-weight: 800; font-size: 28px; letter-spacing: 3px; padding: 14px; border-radius: 16px; background: rgba(0,0,0,.25); border: 1px solid var(--line); margin-bottom: 18px; user-select: all; }
    .btn { display: block; width: 100%; padding: 14px 18px; border-radius: 16px; font-weight: 700; text-decoration: none; margin-bottom: 10px; border: 1px solid var(--line); color: var(--fg); background: rgba(255,255,255,.06); }
    .btn.primary { background: linear-gradient(135deg, var(--brand), var(--brand2)); border: 0; color: #fff; }
    .stores { display: flex; gap: 10px; margin-top: 8px; }
    .stores .btn { margin: 0; font-size: 14px; }
    .hint { font-size: 13px; margin-top: 16px; }
    .langs { margin-top: 18px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .langs button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
    .langs button[aria-current="true"] { color: var(--fg); font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icon-192.png" alt="EasyPlate" />
    <h1 data-i18n="title"></h1>
    <p data-i18n="lead"></p>
    <div class="code" id="code"></div>
    <a class="btn primary" id="open" data-i18n="open" href="#"></a>
    <p class="hint" data-i18n="hint"></p>
    <div class="stores">
      <a class="btn" href="https://apps.apple.com/app/easyplate" rel="noopener">App Store</a>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.KHEasyDev.easy_plate" rel="noopener">Google Play</a>
    </div>
    <div class="langs" id="langs"></div>
  </main>
  <script>
    const I18N = {
      en: { title: 'Open in EasyPlate', lead: 'Someone shared a recipe, book or meal plan with you. Open the app to join it.', open: 'Open in EasyPlate', hint: 'No app yet? Install it, then enter this code under Shared access.' },
      he: { title: 'לפתוח ב-EasyPlate', lead: 'מישהו שיתף איתכם מתכון, ספר או תפריט. פתחו את האפליקציה כדי להצטרף.', open: 'לפתוח ב-EasyPlate', hint: 'עדיין אין אפליקציה? התקינו, ואז הזינו את הקוד במסך ״גישה משותפת״.' },
      ar: { title: 'افتح في EasyPlate', lead: 'شارك معك شخص ما وصفة أو كتابًا أو خطة وجبات. افتح التطبيق للانضمام.', open: 'افتح في EasyPlate', hint: 'لا تملك التطبيق بعد؟ ثبّته ثم أدخل هذا الرمز في شاشة «الوصول المشترك».' },
      fr: { title: 'Ouvrir dans EasyPlate', lead: 'Quelqu’un a partagé avec vous une recette, un livre ou un plan de repas. Ouvrez l’app pour le rejoindre.', open: 'Ouvrir dans EasyPlate', hint: 'Pas encore l’app ? Installez-la, puis saisissez ce code sous « Accès partagé ».' },
      ru: { title: 'Открыть в EasyPlate', lead: 'Кто-то поделился с вами рецептом, книгой или планом питания. Откройте приложение, чтобы присоединиться.', open: 'Открыть в EasyPlate', hint: 'Ещё нет приложения? Установите его и введите этот код на экране «Общий доступ».' },
    };
    const RTL = new Set(['he', 'ar']);
    // The code is the last path segment (/s/CODE) or ?c= when the host
    // cannot rewrite paths to this page.
    const raw = (new URLSearchParams(location.search).get('c') || location.pathname.split('/').filter(Boolean).pop() || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^EP/, '');
    const code = /^[A-HJ-NP-Z2-9]{8}$/.test(raw) ? raw : '';
    const display = code ? `EP-${code.slice(0, 4)}-${code.slice(4)}` : '';
    document.getElementById('code').textContent = display;
    document.getElementById('code').hidden = !code;
    const appLink = code ? `easyplate://open/s/${code}` : 'easyplate://open/s/';
    document.getElementById('open').href = appLink;
    function setLang(lang) {
      const d = I18N[lang] || I18N.en;
      document.documentElement.lang = lang;
      document.documentElement.dir = RTL.has(lang) ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = d[el.dataset.i18n]; });
      document.title = d.title;
      document.querySelectorAll('#langs button').forEach((b) => b.setAttribute('aria-current', b.dataset.lang === lang));
      try { localStorage.setItem('ep-lang', lang); } catch (_) {}
    }
    const langs = document.getElementById('langs');
    for (const [l, name] of [['he', 'עברית'], ['en', 'English'], ['ar', 'العربية'], ['fr', 'Français'], ['ru', 'Русский']]) {
      const b = document.createElement('button'); b.dataset.lang = l; b.textContent = name; b.onclick = () => setLang(l); langs.appendChild(b);
    }
    let lang = new URLSearchParams(location.search).get('lang');
    try { lang = lang || localStorage.getItem('ep-lang'); } catch (_) {}
    lang = lang || (navigator.language || 'en').slice(0, 2);
    setLang(I18N[lang] ? lang : 'en');
    // Phones that have the app: try it straight away; the page stays as the fallback.
    if (code && /Android|iPhone|iPad/i.test(navigator.userAgent)) setTimeout(() => { location.href = appLink; }, 400);
  </script>
</body>
</html>
